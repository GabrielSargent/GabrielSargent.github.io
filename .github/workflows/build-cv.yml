name: Build and publish CV PDF
on:
  push:
    branches: [master]
    paths:
      - 'cv-source/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile CV with LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: cv-source
          latexmk_use_xelatex: false
      - name: Update website PDF
        run: |
          cp cv-source/main.pdf files/cv.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/cv.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated CV PDF from LaTeX source"
            git push
          fi
