{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

{% if page.url == "/" %}
<!-- Homepage-specific spacing; inline to avoid cached compiled Sass. -->
<style>
  /* Matching blue accents for the site title and profile name. */
  .masthead__menu-item--lg a,
  .masthead__menu-item--lg.selected a,
  .masthead__menu-item--lg.selected a:hover,
  .sidebar .author__name {
    color: #315779;
  }
  .masthead__menu-item--lg.selected a,
  .masthead__menu-item--lg.selected a:hover {
    border-bottom-color: #315779;
  }
  .page__content strong, .page__content b,
  .page__content h3, .page__content h4,
  .page__content h5, .page__content h6 { color: #315779; }
  .page__content h1 { margin-top: 0; margin-bottom: 0.45em; color: #315779; }
  .page__content h2 {
    margin-top: 1.05em;
    margin-bottom: 0.12em;
    padding-bottom: 0.08em;
    color: #315779;
    border-bottom: 1px solid #94aabf;
  }
  .page__content h2 + ul,
  .page__content h2 + ol { margin-top: 0; }
  .page__content h2 + p { margin-top: 0; }
  .page__content ul, .page__content ol { margin-bottom: 0.6em; }
  .page__content li { margin-bottom: 0.2em; }
</style>
{% endif %}

<!-- end custom head snippets -->
